name: Build Voxis Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Create Android project wrapper
        shell: bash
        run: |
          set -euo pipefail

          # Generate an Android-capable Flutter wrapper.
          flutter create --platforms=android --org app.voxis mobile_app

          # Prefer the repository's app source, but tolerate an existing wrapper source.
          if [ -f mobile/lib/main.dart ]; then
            echo "Found mobile/lib/main.dart — copying app source into wrapper"
            rm -rf mobile_app/lib
            cp -R mobile/lib mobile_app/lib
          elif [ -f mobile_app/lib/main.dart ]; then
            echo "Found mobile_app/lib/main.dart — keeping wrapper source"
          else
            echo "::error::No Flutter entry point found at mobile/lib/main.dart or mobile_app/lib/main.dart"
            exit 1
          fi

          cd mobile_app
          flutter pub add http
          flutter pub add web_socket_channel
          flutter pub add file_picker
          flutter pub add http_parser
          mkdir -p android/app/src/debug
          cat > android/app/src/debug/AndroidManifest.xml <<'MANIFEST'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application android:usesCleartextTraffic="true" />
          </manifest>
          MANIFEST
      - name: Install Android NDK with retry
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          NDK_VERSION="28.2.13676358"
          for attempt in 1 2 3; do
            echo "Installing Android NDK $NDK_VERSION (attempt $attempt/3)"
            if yes | "$SDKMANAGER" --install "ndk;$NDK_VERSION"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Could not install Android NDK after 3 attempts"
              exit 1
            fi
            rm -rf "$ANDROID_HOME/ndk/$NDK_VERSION"
            sleep 10
          done
      - name: Build installable debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd mobile_app
          for attempt in 1 2 3; do
            echo "Building APK (attempt $attempt/3)"
            if flutter build apk --debug; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::APK build failed after 3 attempts"
              exit 1
            fi
            rm -rf "$ANDROID_HOME/ndk/28.2.13676358"
            sleep 10
          done
      - uses: actions/upload-artifact@v4
        with:
          name: voxis-android-debug-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
