<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17212b"><title>Voxis — Messenger</title>
<style>
:root{color-scheme:light;--bg:#e7ebef;--panel:#fff;--sidebar:#fff;--line:#e7eaf0;--text:#182533;--muted:#8493a3;--blue:#3390ec;--blue2:#2481d7;--bubble:#fff;--mine:#d9fdd3;--hover:#f1f5f8;--field:#f1f3f5}
*{box-sizing:border-box}body{margin:0;font:15px/1.4 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);height:100dvh;overflow:hidden}button,input,textarea{font:inherit}button{cursor:pointer;border:0}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #70b7f8;outline-offset:2px}.app{height:100dvh;width:100%;display:grid;grid-template-columns:360px minmax(0,1fr);max-width:1600px;margin:auto;background:var(--panel);box-shadow:0 0 40px #192d3d0d}.sidebar{display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--line);background:var(--sidebar);z-index:2}.side-top{height:64px;display:flex;align-items:center;gap:12px;padding:0 16px}.icon-btn{width:40px;height:40px;border-radius:50%;background:transparent;color:#6d7e8d;display:grid;place-items:center;font-size:21px}.icon-btn:hover{background:var(--hover)}.brand{font-weight:750;font-size:21px;letter-spacing:-.7px;display:flex;align-items:center;gap:9px}.logo{width:31px;height:31px;border-radius:10px;background:var(--blue);color:white;display:grid;place-items:center;font-weight:800;font-size:18px}.side-tools{display:flex;gap:10px;padding:4px 14px 14px}.search-wrap{flex:1;position:relative}.search-wrap span{position:absolute;left:13px;top:9px;color:#8a99a7;font-size:19px}.search{width:100%;height:40px;border:0;border-radius:10px;background:var(--field);padding:0 12px 0 40px;color:var(--text);outline:none}.search:focus{box-shadow:inset 0 0 0 1px #a4d2fa}.filterbar{display:flex;gap:5px;padding:0 13px 9px}.filter{padding:7px 13px;border-radius:9px;background:transparent;color:var(--muted);font-size:13px;font-weight:650}.filter.active{background:#e6f3ff;color:#1685e9}.chat-list{overflow:auto;flex:1;padding:0 6px}.chat-row{width:100%;display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;text-align:left;background:transparent;color:inherit;min-height:76px}.chat-row:hover{background:var(--hover)}.chat-row.active{background:#e5f2ff}.avatar{width:50px;height:50px;border-radius:50%;flex:none;display:grid;place-items:center;color:white;font-size:19px;font-weight:650;background:linear-gradient(145deg,#78b9e8,#4c83d2);overflow:hidden;text-transform:uppercase}.avatar img{width:100%;height:100%;object-fit:cover}.avatar.a1{background:linear-gradient(145deg,#efb57e,#dc785a)}.avatar.a2{background:linear-gradient(145deg,#a1c99b,#4c9c85)}.avatar.a3{background:linear-gradient(145deg,#ba9bea,#8469c5)}.avatar.a4{background:linear-gradient(145deg,#ed9cbd,#c05c89)}.chat-meta{min-width:0;flex:1}.chat-topline{display:flex;align-items:center;gap:8px;justify-content:space-between}.chat-name{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat-time{font-size:11px;color:var(--muted);white-space:nowrap}.chat-preview{font-size:13px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.unread{min-width:20px;height:20px;border-radius:12px;background:var(--blue);color:white;font-size:11px;display:grid;place-items:center;padding:0 5px}.empty-note{color:var(--muted);font-size:13px;text-align:center;padding:28px 18px}.me-bar{border-top:1px solid var(--line);padding:12px;display:flex;align-items:center;gap:10px}.me-copy{min-width:0;flex:1}.me-copy strong{display:block;overflow:hidden;text-overflow:ellipsis}.me-copy small{color:var(--muted)}.main{min-width:0;display:flex;flex-direction:column;position:relative;background:#dce5ec}.chat-head{height:64px;display:flex;align-items:center;padding:0 20px;gap:13px;background:var(--panel);border-bottom:1px solid var(--line);z-index:1}.head-info{min-width:0;flex:1}.head-name{font-weight:700;font-size:16px}.head-status{font-size:12px;color:var(--muted);margin-top:2px}.head-actions{display:flex;gap:5px}.messages{flex:1;overflow-y:auto;padding:24px max(24px,calc((100% - 850px)/2));display:flex;flex-direction:column;gap:5px;background-color:#dce5ec;background-image:radial-gradient(#b6c8d4 0.7px,transparent .7px);background-size:18px 18px;scroll-behavior:smooth}.day-pill{align-self:center;padding:5px 12px;border-radius:20px;background:#7894a6;color:#fff;font-size:11px;font-weight:700;margin:3px 0 15px;box-shadow:0 1px 3px #0001}.bubble{max-width:min(72%,570px);align-self:flex-start;background:var(--bubble);padding:8px 11px 5px;border-radius:13px 13px 13px 4px;box-shadow:0 1px 1px #14212b12;overflow-wrap:anywhere;white-space:pre-wrap}.bubble.mine{align-self:flex-end;background:var(--mine);border-radius:13px 13px 4px 13px}.bubble-author{font-size:12px;font-weight:700;color:#3292cb;margin-bottom:3px}.bubble-text{font-size:14px;line-height:1.45}.bubble-foot{display:flex;align-items:center;justify-content:flex-end;gap:4px;color:#87959b;font-size:10px;margin:3px 0 0 14px}.ticks{color:#299bd3;font-size:12px}.attachment{display:inline-flex;align-items:center;gap:8px;background:#00000008;border-radius:8px;padding:8px;margin-bottom:4px;color:inherit;text-decoration:none}.attachment b{font-size:12px}.composer-area{padding:12px 20px 17px;background:linear-gradient(0deg,#dce5ec 78%,transparent)}.composer{max-width:900px;margin:auto;display:flex;align-items:flex-end;gap:9px;background:var(--panel);padding:7px 9px;border-radius:14px;box-shadow:0 2px 8px #20313f12}.compose-input{resize:none;min-height:42px;max-height:130px;flex:1;border:0;background:transparent;padding:11px 5px;outline:none;color:var(--text)}.send-btn{width:42px;height:42px;border-radius:50%;background:var(--blue);color:white;font-size:20px;display:grid;place-items:center;flex:none}.send-btn:hover{background:var(--blue2)}.send-btn:disabled{opacity:.5;cursor:default}.attach-btn{width:38px;height:42px;border-radius:50%;background:transparent;color:#8393a0;font-size:21px}.attach-btn:hover{background:var(--hover)}.welcome{height:100%;display:grid;place-items:center;text-align:center;color:#fff;padding:30px}.welcome-card{max-width:390px}.welcome-orb{width:115px;height:115px;border-radius:50%;background:#c5d8e3;display:grid;place-items:center;margin:0 auto 25px;font-size:52px;color:#fff;box-shadow:0 14px 40px #243d4b1a}.welcome h1{font-size:25px;margin:0 0 10px;color:#fff}.welcome p{margin:0;color:#637987;font-size:14px}.modal-backdrop{position:fixed;inset:0;background:#10202f80;display:grid;place-items:center;z-index:10;padding:18px}.modal{width:min(420px,100%);background:var(--panel);border-radius:18px;padding:25px;box-shadow:0 25px 90px #10202f40}.modal h2{margin:0 0 6px;font-size:23px}.sub{color:var(--muted);font-size:13px;margin:0 0 22px}.field{display:block;width:100%;height:46px;padding:0 13px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--text);margin:9px 0}.primary{width:100%;height:46px;background:var(--blue);color:white;border-radius:10px;font-weight:700;margin-top:10px}.switch-auth{display:block;margin:17px auto 0;color:var(--blue);background:transparent}.error{font-size:13px;color:#d34e58;min-height:18px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#263b4b;color:white;padding:11px 16px;border-radius:10px;box-shadow:0 8px 25px #0002;z-index:20;font-size:13px;max-width:90vw}.mobile-back{display:none}.hidden{display:none!important}.icon-btn svg,.send-btn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media(min-width:1100px){.app{height:calc(100dvh - 28px);margin:14px auto;border-radius:14px;overflow:hidden}.messages{padding-left:max(30px,calc((100% - 760px)/2));padding-right:max(30px,calc((100% - 760px)/2))}}@media(max-width:700px){.app{grid-template-columns:minmax(0,1fr);height:100dvh}.sidebar{grid-column:1;grid-row:1}.main{grid-column:1;grid-row:1;display:none}.app.chat-open .sidebar{display:none}.app.chat-open .main{display:flex}.chat-head{padding:0 10px}.mobile-back{display:grid}.messages{padding:16px 10px}.bubble{max-width:86%}.composer-area{padding:8px 9px 10px}.side-top{height:58px}.me-bar{padding:9px 12px}.head-actions .hide-mobile{display:none}.welcome{display:none}.chat-list{padding:0 5px}.brand{font-size:19px}}
</style></head>
<body>
<div class="app" id="app">
<aside class="sidebar">
 <div class="side-top"><button class="icon-btn" id="menuBtn" title="Меню" aria-label="Меню">☰</button><div class="brand"><span class="logo">V</span> Voxis</div><button class="icon-btn" id="newChatBtn" title="Новый чат" aria-label="Новый чат">✎</button></div>
 <div class="side-tools"><div class="search-wrap"><span>⌕</span><input id="search" class="search" placeholder="Поиск" autocomplete="off"></div></div>
 <div class="filterbar"><button class="filter active" data-filter="all">Все чаты</button><button class="filter" data-filter="people">Люди</button><button class="filter" data-filter="groups">Группы</button></div>
 <div class="chat-list" id="chatList"><div class="empty-note">Загружаем чаты…</div></div>
 <div class="me-bar"><div class="avatar a3" id="myAvatar">V</div><div class="me-copy"><strong id="myName">Гость</strong><small id="myHandle">@guest</small></div><button class="icon-btn" id="profileBtn" title="Профиль">⚙</button></div>
</aside>
<main class="main">
 <header class="chat-head hidden" id="chatHead"><button class="icon-btn mobile-back" id="backBtn" aria-label="Назад">‹</button><div class="avatar" id="headAvatar">?</div><div class="head-info"><div class="head-name" id="headName">Чат</div><div class="head-status" id="headStatus">Voxis</div></div><div class="head-actions"><button class="icon-btn" id="searchChatBtn" title="Найти сообщения">⌕</button><button class="icon-btn hide-mobile" id="chatInfoBtn" title="Информация">⋮</button></div></header>
 <section class="welcome" id="welcome"><div class="welcome-card"><div class="welcome-orb">✉</div><h1>Добро пожаловать в Voxis</h1><p>Выберите чат, чтобы начать общение. Ваши разговоры — в одном удобном месте.</p></div></section>
 <section class="messages hidden" id="messages"><div class="day-pill">Сегодня</div></section>
 <div class="composer-area hidden" id="composerArea"><form class="composer" id="composer"><input type="file" id="fileInput" hidden><button type="button" class="attach-btn" id="attachBtn" title="Прикрепить файл">⌁</button><textarea id="messageInput" class="compose-input" rows="1" placeholder="Сообщение…" maxlength="4000"></textarea><button class="send-btn" id="sendBtn" aria-label="Отправить" disabled><svg viewBox="0 0 24 24"><path d="M22 2 11 13"/><path d="m22 2-7 20-4-9-9-4Z"/></svg></button></form></div>
</main></div>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const state={token:localStorage.getItem('voxis.web.token')||'',me:null,users:[],groups:[],chats:[],active:null,filter:'all',query:'',socket:null,typingTimer:null,refreshTimer:null,authMode:'login',file:null};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials=s=>(s||'?').trim().slice(0,1).toUpperCase();
const apiBase=()=>localStorage.getItem('voxis.web.server')||location.origin;
async function api(path,opts={}){const headers=new Headers(opts.headers||{});if(state.token)headers.set('Authorization','Bearer '+state.token);if(opts.body&&!(opts.body instanceof FormData))headers.set('Content-Type','application/json');let r;try{r=await fetch(apiBase()+path,{...opts,headers})}catch(e){throw new Error('Не удаётся подключиться к серверу. Проверьте адрес API и соединение.')}let data;try{data=await r.json()}catch{data={}}if(!r.ok){if(r.status===401&&state.token){logout(false);throw new Error('Сессия завершена. Войдите снова.')}throw new Error(data.detail||'Ошибка запроса ('+r.status+')')}return data}
function toast(msg){$('toastRoot').innerHTML='<div class="toast">'+esc(msg)+'</div>';setTimeout(()=>$('toastRoot').innerHTML='',3000)}
function showModal(html){$('modalRoot').innerHTML='<div class="modal-backdrop" id="backdrop"><section class="modal">'+html+'</section></div>'; $('backdrop').addEventListener('click',e=>{if(e.target.id==='backdrop')closeModal()})}
function closeModal(){$('modalRoot').innerHTML=''}
function authModal(mode='login'){state.authMode=mode;showModal('<div class="brand" style="margin-bottom:25px"><span class="logo">V</span> Voxis</div><h2>'+(mode==='login'?'С возвращением':'Создать аккаунт')+'</h2><p class="sub">'+(mode==='login'?'Войдите, чтобы продолжить общение':'Придумайте имя пользователя и надёжный пароль')+'</p><form id="authForm"><input class="field" id="authUser" placeholder="Имя пользователя" minlength="3" maxlength="24" pattern="[A-Za-z0-9_.-]+" required autocomplete="username"><input class="field" id="authPass" placeholder="Пароль (минимум 10 символов)" type="password" minlength="'+(mode==='register'?10:8)+'" required autocomplete="'+(mode==='login'?'current-password':'new-password')+'"><div class="error" id="authError"></div><button class="primary" id="authSubmit">'+(mode==='login'?'Войти':'Зарегистрироваться')+'</button></form><button class="switch-auth" id="authSwitch">'+(mode==='login'?'Нет аккаунта? Зарегистрироваться':'Уже есть аккаунт? Войти')+'</button>');$('authSwitch').onclick=()=>authModal(mode==='login'?'register':'login');$('authForm').onsubmit=async e=>{e.preventDefault();const btn=$('authSubmit');btn.disabled=true;btn.textContent='Подождите…';$('authError').textContent='';try{const d=await api('/api/'+(mode==='login'?'login':'register'),{method:'POST',body:JSON.stringify({username:$('authUser').value.trim(),password:$('authPass').value,device_id:'web-'+getDeviceId(),platform:'web'})});state.token=d.token;localStorage.setItem('voxis.web.token',state.token);closeModal();await boot()}catch(err){$('authError').textContent=err.message;btn.disabled=false;btn.textContent=mode==='login'?'Войти':'Зарегистрироваться'}}}
function getDeviceId(){let id=localStorage.getItem('voxis.web.device');if(!id){id='browser-'+(crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2));localStorage.setItem('voxis.web.device',id)}return id}
async function logout(callApi=true){if(callApi&&state.token){try{await api('/api/logout',{method:'POST'})}catch{}}state.token='';state.me=null;localStorage.removeItem('voxis.web.token');if(state.socket)state.socket.close();clearInterval(state.refreshTimer);$('app').classList.remove('chat-open');$('chatList').innerHTML='';$('myName').textContent='Гость';$('myHandle').textContent='@guest';authModal('login')}
function avatarHtml(person,cls=''){const name=person.display_name||person.name||person.username||'?';const color='a'+((String(person.username||name).charCodeAt(0)||0)%4+1);const src=person.avatar_url?(person.avatar_url.startsWith('http')?person.avatar_url:apiBase()+person.avatar_url):'';return '<div class="avatar '+color+' '+cls+'">'+(src?'<img src="'+esc(src)+'" alt="" onerror="this.remove()">':esc(initials(name)))+'</div>'}
function chatLabel(c){return c.type==='group'?c.name:(c.display_name||c.username)}
function chatKey(c){return c.type==='group'?'g:'+c.id:'u:'+c.username}
function rebuildChats(){const old=state.active&&chatKey(state.active);state.chats=[...state.users.map(u=>({...u,type:'user',lastText:'Начать общение'})),...state.groups.map(g=>({...g,type:'group',lastText:(g.member_count||1)+' участников'}))];if(old)state.active=state.chats.find(c=>chatKey(c)===old)||null;renderChats()}
function renderChats(){const q=state.query.toLowerCase();const list=state.chats.filter(c=>(state.filter==='all'||(state.filter==='groups'&&c.type==='group')||(state.filter==='people'&&c.type==='user'))&&(chatLabel(c)+' '+(c.username||'')).toLowerCase().includes(q));$('chatList').innerHTML=list.length?list.map(c=>'<button class="chat-row '+(state.active&&chatKey(state.active)===chatKey(c)?'active':'')+'" data-key="'+esc(chatKey(c))+'">'+avatarHtml(c)+'<span class="chat-meta"><span class="chat-topline"><span class="chat-name">'+esc(chatLabel(c))+'</span><span class="chat-time">'+(c.type==='group'?'группа':'')+'</span></span><span class="chat-preview">'+esc(c.lastText||c.username||'')+'</span></span></button>').join(''):'<div class="empty-note">'+(q?'Ничего не найдено':'Здесь пока пусто. Найдите людей или создайте группу.')+'</div>';for(const b of $('chatList').querySelectorAll('.chat-row'))b.onclick=()=>openChat(state.chats.find(c=>chatKey(c)===b.dataset.key))}
async function loadData(){const [u,g]=await Promise.all([api('/api/users'),api('/api/groups')]);state.users=u.users||[];state.groups=g.groups||[];rebuildChats();updateMe()}
function updateMe(){if(!state.me)return;$('myName').textContent=state.me.display_name||state.me.username;$('myHandle').textContent='@'+state.me.username;$('myAvatar').textContent=initials(state.me.display_name||state.me.username);if(state.me.avatar_url){$('myAvatar').innerHTML='<img src="'+esc(apiBase()+state.me.avatar_url)+'" alt="">'}}
function updateHead(){if(!state.active)return;const c=state.active;$('chatHead').classList.remove('hidden');$('welcome').classList.add('hidden');$('messages').classList.remove('hidden');$('composerArea').classList.remove('hidden');$('headName').textContent=chatLabel(c);$('headAvatar').innerHTML=avatarHtml(c).replace(/^<div[^>]*>/,'').replace(/<\/div>$/,'');$('headStatus').textContent=c.type==='group'?(c.member_count||1)+' участников':'личный чат';}
async function openChat(c){state.active=c;renderChats();$('app').classList.add('chat-open');updateHead();await loadMessages();if(state.socket&&c.type==='user'){state.socket.send(JSON.stringify({type:'typing',to:c.username,active:false}))}$('messageInput').focus()}
async function loadMessages(){if(!state.active)return;const c=state.active;try{const d=await api(c.type==='group'?'/api/group-messages/'+c.id:'/api/messages/'+encodeURIComponent(c.username)+'?limit=100');renderMessages(d.messages||[])}catch(e){toast(e.message)}}
function fmtTime(v){try{return new Date(v).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}catch{return''}}
function renderMessages(rows){const el=$('messages');const atBottom=el.scrollHeight-el.scrollTop-el.clientHeight<90;el.innerHTML='<div class="day-pill">История сообщений</div>'+rows.map(m=>{const mine=m.sender===state.me.username;const c=state.active;const file=m.attachment_id?'<a class="attachment" href="'+apiBase()+'/api/attachments/'+m.attachment_id+'" target="_blank" rel="noopener" data-file="'+m.attachment_id+'">📎 <b>'+esc(m.attachment_name||'Вложение')+'</b></a>':'';return '<article class="bubble '+(mine?'mine':'')+'" data-id="'+m.id+'">'+(!mine&&c.type==='group'?'<div class="bubble-author">'+esc(m.sender)+'</div>':'')+(file?file:'')+(m.body?'<div class="bubble-text">'+esc(m.body)+'</div>':'')+'<div class="bubble-foot">'+fmtTime(m.created_at)+(mine?'<span class="ticks">✓</span>':'')+'</div></article>'}).join('');if(atBottom)el.scrollTop=el.scrollHeight;for(const m of rows){if(m.sender!==state.me.username){api('/api/messages/'+m.id+'/read',{method:'POST'}).catch(()=>{})}}}
async function sendMessage(e){e.preventDefault();if(!state.active)return;const text=$('messageInput').value.trim();if(!text&&!state.file)return;const btn=$('sendBtn');btn.disabled=true;try{let attachment_id=null;if(state.file){const fd=new FormData();fd.append('file',state.file);const f=await api('/api/attachments',{method:'POST',body:fd});attachment_id=f.id;state.file=null;$('fileInput').value='';$('attachBtn').textContent='⌁'}await api('/api/messages',{method:'POST',body:JSON.stringify({recipient:state.active.type==='user'?state.active.username:null,group_id:state.active.type==='group'?state.active.id:null,body:text,attachment_id})});$('messageInput').value='';resizeInput();await loadMessages()}catch(err){toast(err.message)}finally{btn.disabled=!$('messageInput').value.trim()&&!state.file}}
function resizeInput(){const i=$('messageInput');i.style.height='auto';i.style.height=Math.min(i.scrollHeight,130)+'px';$('sendBtn').disabled=!i.value.trim()&&!state.file}
function connectSocket(){if(!state.token)return;try{const u=new URL(apiBase());u.protocol=u.protocol==='https:'?'wss:':'ws:';u.pathname='/ws';u.search='?token='+encodeURIComponent(state.token);state.socket=new WebSocket(u);state.socket.onmessage=e=>{let d;try{d=JSON.parse(e.data)}catch{return}if(d.type==='message'&&state.active&&((state.active.type==='user'&&((d.message.sender===state.active.username)||(d.message.sender===state.me.username&&d.message.recipient===state.active.username)))||(state.active.type==='group'&&d.message.group_id===state.active.id)))loadMessages();if(d.type==='group_created'||d.type==='presence')loadData().catch(()=>{});if(d.type==='typing'&&state.active?.type==='user'&&d.from===state.active.username)$('headStatus').textContent=d.active?'печатает…':'личный чат';if(d.type==='message_edited'||d.type==='message_deleted'){if(state.active)loadMessages()}};state.socket.onclose=()=>{if(state.token)setTimeout(connectSocket,3500)}}catch{}}
function showProfile(){showModal('<h2>Ваш профиль</h2><p class="sub">Настройте отображаемое имя и информацию о себе.</p><form id="profileForm"><label class="sub">Имя</label><input class="field" id="profileName" maxlength="60" value="'+esc(state.me.display_name||'')+'" placeholder="Как вас называть"><label class="sub">О себе</label><input class="field" id="profileBio" maxlength="300" value="'+esc(state.me.bio||'')+'" placeholder="Несколько слов о себе"><label class="sub">Аватар</label><input class="field" id="profileAvatar" type="file" accept="image/png,image/jpeg,image/webp"><div class="error" id="profileError"></div><button class="primary">Сохранить</button></form><button class="switch-auth" id="logoutBtn">Выйти из аккаунта</button>');$('profileForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/profile',{method:'PATCH',body:JSON.stringify({display_name:$('profileName').value,bio:$('profileBio').value})});const file=$('profileAvatar').files[0];if(file){const fd=new FormData();fd.append('file',file);await api('/api/avatar',{method:'POST',body:fd})}state.me=await api('/api/me');updateMe();closeModal();toast('Профиль сохранён')}catch(err){$('profileError').textContent=err.message}};$('logoutBtn').onclick=()=>{closeModal();logout()}}
async function createGroup(){const options=state.users.map(u=>'<label style="display:flex;gap:8px;align-items:center;margin:10px 0"><input type="checkbox" value="'+esc(u.username)+'"> '+esc(u.display_name||u.username)+' <span class="sub">@'+esc(u.username)+'</span></label>').join('');showModal('<h2>Новая группа</h2><p class="sub">Придумайте название и выберите участников.</p><form id="groupForm"><input class="field" id="groupName" placeholder="Название группы" maxlength="80" required><div style="max-height:240px;overflow:auto">'+(options||'<p class="sub">Пока нет других пользователей.</p>')+'</div><div class="error" id="groupError"></div><button class="primary">Создать группу</button></form>');$('groupForm').onsubmit=async e=>{e.preventDefault();const members=[...document.querySelectorAll('#groupForm input[type=checkbox]:checked')].map(x=>x.value);try{await api('/api/groups',{method:'POST',body:JSON.stringify({name:$('groupName').value,members})});closeModal();await loadData();const group=state.chats.find(c=>c.type==='group'&&c.name===$('groupName')?.value);toast('Группа создана');if(state.groups.length)openChat(state.chats.find(c=>c.type==='group'&&c.id===state.groups[0].id))}catch(err){$('groupError').textContent=err.message}}}
async function newChat(){showModal('<h2>Новый чат</h2><p class="sub">Выберите пользователя или создайте групповую беседу.</p><div id="newChatPeople">'+state.users.map(u=>'<button class="chat-row" style="width:100%" data-user="'+esc(u.username)+'">'+avatarHtml(u)+'<span class="chat-meta"><span class="chat-name">'+esc(u.display_name||u.username)+'</span><span class="chat-preview">@'+esc(u.username)+'</span></span></button>').join('')+'</div><button class="primary" id="createGroupBtn">＋ Создать группу</button>');for(const b of document.querySelectorAll('[data-user]'))b.onclick=()=>{const c=state.chats.find(x=>x.username===b.dataset.user);closeModal();if(c)openChat(c)};$('createGroupBtn').onclick=createGroup}
async function searchMessages(){if(!state.active)return;const q=prompt('Найти сообщения в Voxis:');if(!q)return;try{const d=await api('/api/search/messages?q='+encodeURIComponent(q));const rows=(d.messages||[]).filter(m=>state.active.type==='group'?m.group_id===state.active.id:m.group_id===null&&(m.sender===state.active.username||m.recipient===state.active.username));if(!rows.length){toast('Ничего не найдено в этом чате');return}renderMessages(rows.reverse());toast('Результаты поиска: '+rows.length)}catch(e){toast(e.message)}}
async function chatInfo(){if(!state.active)return;const c=state.active;if(c.type==='group'){try{const d=await api('/api/groups/'+c.id+'/members');showModal('<h2>'+esc(c.name)+'</h2><p class="sub">Участники группы</p>'+d.members.map(m=>'<div style="padding:10px 0;border-bottom:1px solid var(--line)"><b>'+esc(m.username)+'</b><span class="sub"> · '+esc(m.role)+'</span></div>').join('')+'<button class="primary" id="groupAdd">Добавить участников</button>');$('groupAdd').onclick=()=>{closeModal();addGroupMembers(c)} }catch(e){toast(e.message)}}else{showModal('<h2>'+esc(chatLabel(c))+'</h2><p class="sub">@'+esc(c.username)+'</p><p>'+esc(c.bio||'')+'</p><button class="primary" id="blockBtn" style="background:#d95059">Заблокировать пользователя</button>');$('blockBtn').onclick=async()=>{try{await api('/api/blocks',{method:'POST',body:JSON.stringify({username:c.username})});closeModal();toast('Пользователь заблокирован')}catch(e){toast(e.message)}}}}
async function addGroupMembers(c){showModal('<h2>Добавить участников</h2><p class="sub">Выберите пользователей для группы '+esc(c.name)+'</p>'+state.users.map(u=>'<label style="display:flex;gap:8px;margin:12px 0"><input type="checkbox" value="'+esc(u.username)+'"> '+esc(u.display_name||u.username)+'</label>').join('')+'<button class="primary" id="addMembers">Добавить</button>');$('addMembers').onclick=async()=>{const members=[...document.querySelectorAll('.modal input:checked')].map(x=>x.value);try{await api('/api/groups/'+c.id+'/members',{method:'POST',body:JSON.stringify({name:c.name,members})});closeModal();await loadData();toast('Участники добавлены')}catch(e){toast(e.message)}}}
async function boot(){if(!state.token){authModal();return}try{state.me=await api('/api/me');updateMe();await loadData();connectSocket();clearInterval(state.refreshTimer);state.refreshTimer=setInterval(()=>{loadData().catch(()=>{});if(state.active)loadMessages()},12000);if(!state.active)$('headStatus').textContent='Готов к общению'}catch(e){if(state.token)toast(e.message)}}
$('search').oninput=e=>{state.query=e.target.value;renderChats()};document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));renderChats()});$('composer').onsubmit=sendMessage;$('messageInput').oninput=resizeInput;$('messageInput').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('composer').requestSubmit()}if(state.active?.type==='user'&&state.socket){clearTimeout(state.typingTimer);state.socket.send(JSON.stringify({type:'typing',to:state.active.username,active:true}));state.typingTimer=setTimeout(()=>state.socket?.send(JSON.stringify({type:'typing',to:state.active.username,active:false})),1200)}};$('attachBtn').onclick=()=>$('fileInput').click();$('fileInput').onchange=e=>{state.file=e.target.files[0]||null;$('attachBtn').textContent=state.file?'📎':'⌁';if(state.file)toast('Файл: '+state.file.name);resizeInput()};$('newChatBtn').onclick=newChat;$('profileBtn').onclick=showProfile;$('menuBtn').onclick=()=>showModal('<h2>Voxis</h2><p class="sub">Лёгкий и быстрый мессенджер.</p><button class="primary" id="menuProfile">Профиль и настройки</button><button class="switch-auth" id="menuNewGroup">Создать группу</button>');$('searchChatBtn').onclick=searchMessages;$('chatInfoBtn').onclick=chatInfo;$('backBtn').onclick=()=>$('app').classList.remove('chat-open');document.addEventListener('click',e=>{if(e.target.id==='menuProfile'){closeModal();showProfile()}if(e.target.id==='menuNewGroup'){closeModal();createGroup()}});
if(state.token)boot();else authModal();
})();
</script></body></html>
