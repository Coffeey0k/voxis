server { listen 80; server_name _; root /usr/share/nginx/html; index index.html; location /api/ { proxy_pass http://api:4000/api/; proxy_set_header Host $host; } location /socket.io/ { proxy_pass http://api:4000/socket.io/; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; proxy_read_timeout 3600s; } location / { try_files $uri $uri/ /index.html; } }
