name: voxis-platform
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: voxis
      POSTGRES_USER: voxis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voxis_local_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voxis -d voxis"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-change-this-minio-secret}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]
  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-change-this-minio-secret}
      S3_BUCKET: ${S3_BUCKET:-voxis}
    entrypoint: ["/bin/sh", "-c"]
    command: 'until mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do sleep 2; done; mc mb --ignore-existing "local/$S3_BUCKET"'
    restart: "no"
  api:
    build: { context: ., dockerfile: Dockerfile.api }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://voxis:${POSTGRES_PASSWORD:-voxis_local_password}@postgres:5432/voxis
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    ports: ["4000:4000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
  web:
    build: { context: ., dockerfile: Dockerfile.web }
    restart: unless-stopped
    ports: ["8080:80"]
    depends_on: [api]
volumes:
  postgres_data:
  redis_data:
  minio_data:
